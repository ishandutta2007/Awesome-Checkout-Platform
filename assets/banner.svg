<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0b0f19"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".15"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><radialGradient id="glowLeft" cx="20%" cy="40%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".25"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient><radialGradient id="glowRight" cx="80%" cy="60%" r="50%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".22"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".5" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity=".4"/></pattern></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatCard1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(.8deg)}}@keyframes floatCard2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(8px) rotate(-.8deg)}}@keyframes dashStream{0%{stroke-dashoffset:120}}@keyframes radarPing{0%{r:4;opacity:.9}}.pulsing-orb-1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:240px 180px}.pulsing-orb-2{animation:pulseGlow 7s ease-in-out infinite 1.5s;transform-origin:960px 240px}.card-float-left,.card-float-right{animation:floatCard1 5s ease-in-out infinite;transform-origin:center}.card-float-right{animation:floatCard2 5.5s ease-in-out infinite .7s}.flow-stream{stroke-dasharray:8 6;animation:dashStream 3s linear infinite}.radar-signal{animation:radarPing 2.5s cubic-bezier(0,.2,.8,1) infinite}.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.03em}.sub-text{font-weight:500}.code-font{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><circle cx="240" cy="180" r="190" fill="url(#glowLeft)" class="pulsing-orb-1"/><circle cx="960" cy="240" r="210" fill="url(#glowRight)" class="pulsing-orb-2"/><g opacity=".45"><path fill="none" stroke="#6366f1" stroke-width="2" d="M 120 340 C 300 370, 480 320, 600 340 C 740 360, 920 320, 1080 350" class="flow-stream"/><path fill="none" stroke="#ec4899" stroke-width="1.5" d="M 150 90 C 340 60, 520 110, 680 80 C 840 50, 980 95, 1060 70" class="flow-stream"/></g><g class="card-float-left" transform="translate(60, 110)"><rect width="180" height="110" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" rx="14"/><circle cx="30" cy="30" r="10" fill="#10b981" fill-opacity=".2"/><circle cx="30" cy="30" r="5" fill="#10b981"/><text x="50" y="34" fill="#94a3b8" class="code-font" font-size="11" font-weight="600">CHECKOUT_OK</text><rect width="136" height="6" x="22" y="55" fill="#334155" rx="3"/><rect width="90" height="6" x="22" y="70" fill="#6366f1" fill-opacity=".6" rx="3"/><rect width="55" height="14" x="22" y="85" fill="#6366f1" fill-opacity=".3" rx="4"/><text x="30" y="96" fill="#a5b4fc" class="code-font" font-size="9">1-CLICK</text></g><g class="card-float-right" transform="translate(960, 110)"><rect width="180" height="110" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" rx="14"/><circle cx="150" cy="30" r="8" fill="none" stroke="#8b5cf6" stroke-width="2" class="radar-signal"/><circle cx="150" cy="30" r="4" fill="#8b5cf6"/><text x="24" y="34" fill="#cbd5e1" class="code-font" font-size="11" font-weight="600">ORCHESTRATOR</text><line x1="24" x2="156" y1="58" y2="58" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/><text x="24" y="76" fill="#94a3b8" class="sub-text" font-size="10">Latency: 12ms</text><text x="24" y="94" fill="#10b981" class="code-font" font-size="10">Routing: 99.98%</text></g><g transform="translate(600, 75)"><rect width="280" height="32" x="-140" y="-16" fill="url(#badgeGrad)" stroke="#6366f1" stroke-width="1.2" rx="16"/><circle cx="-116" cy="0" r="4" fill="#ec4899"/><text x="-104" y="5" fill="#e0e7ff" class="code-font" font-size="11" font-weight="600" letter-spacing=".08em">CURATED COMMERCE &amp; PAYMENTS</text></g><text x="600" y="160" fill="#fff" class="title-text" filter="url(#glowFilter)" font-size="52" text-anchor="middle">Awesome Checkout Platform</text><text x="600" y="160" fill="url(#primaryGrad)" class="title-text" font-size="52" text-anchor="middle">Awesome Checkout Platform</text><text x="600" y="212" fill="#f1f5f9" class="sub-text" font-size="20" text-anchor="middle">Hosted Checkout Pages, Payment Orchestration &amp; Composable Frameworks</text><text x="600" y="246" fill="#94a3b8" class="sub-text" font-size="14" letter-spacing=".02em" text-anchor="middle">Comparing top SaaS Checkout leaders alongside high-performance Open-Source payment stacks</text><g><g transform="translate(230, 290) translate(0, 0)"><rect width="165" height="36" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" rx="18"/><text x="82" y="23" fill="#93c5fd" class="sub-text" font-size="12" font-weight="600" text-anchor="middle">⚡ 1-Click Checkout</text></g><g transform="translate(230, 290) translate(185, 0)"><rect width="190" height="36" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" rx="18"/><text x="95" y="23" fill="#c4b5fd" class="sub-text" font-size="12" font-weight="600" text-anchor="middle">💳 Payment Orchestration</text></g><g transform="translate(230, 290) translate(395, 0)"><rect width="170" height="36" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" rx="18"/><text x="85" y="23" fill="#f472b6" class="sub-text" font-size="12" font-weight="600" text-anchor="middle">🛡️ PCI-DSS Compliant</text></g><g transform="translate(230, 290) translate(585, 0)"><rect width="160" height="36" fill="#1e293b" stroke="#10b981" stroke-width="1.2" rx="18"/><text x="80" y="23" fill="#6ee7b7" class="sub-text" font-size="12" font-weight="600" text-anchor="middle">🚀 Open-Source Stacks</text></g></g><rect width="1200" height="4" x="0" y="416" fill="url(#primaryGrad)"/></svg>
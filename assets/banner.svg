<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Accent Glowing Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.8deg); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-0.8deg); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarPing {
      0% { r: 4; opacity: 0.9; }
      100% { r: 24; opacity: 0; }
    }
    .pulsing-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 240px 180px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 7s ease-in-out infinite 1.5s;
      transform-origin: 960px 240px;
    }
    .card-float-left {
      animation: floatCard1 5s ease-in-out infinite;
      transform-origin: center;
    }
    .card-float-right {
      animation: floatCard2 5.5s ease-in-out infinite 0.7s;
      transform-origin: center;
    }
    .flow-stream {
      stroke-dasharray: 8 6;
      animation: dashStream 3s linear infinite;
    }
    .radar-signal {
      animation: radarPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .code-font {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Ambient Orbs -->
  <circle class="pulsing-orb-1" cx="240" cy="180" r="190" fill="url(#glowLeft)" />
  <circle class="pulsing-orb-2" cx="960" cy="240" r="210" fill="url(#glowRight)" />

  <!-- Connecting Dynamic Data Streams (Behind text) -->
  <g opacity="0.45">
    <path class="flow-stream" d="M 120 340 C 300 370, 480 320, 600 340 C 740 360, 920 320, 1080 350" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="flow-stream" d="M 150 90 C 340 60, 520 110, 680 80 C 840 50, 980 95, 1060 70" fill="none" stroke="#ec4899" stroke-width="1.5" />
  </g>

  <!-- Dynamic Side Graphic 1: Payment Checkout Flow Node (Left Background) -->
  <g class="card-float-left" transform="translate(60, 110)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="30" cy="30" r="10" fill="#10b981" fill-opacity="0.2" />
    <circle cx="30" cy="30" r="5" fill="#10b981" />
    <text x="50" y="34" fill="#94a3b8" class="code-font" font-size="11" font-weight="600">CHECKOUT_OK</text>
    <rect x="22" y="55" width="136" height="6" rx="3" fill="#334155" />
    <rect x="22" y="70" width="90" height="6" rx="3" fill="#6366f1" fill-opacity="0.6" />
    <rect x="22" y="85" width="55" height="14" rx="4" fill="#6366f1" fill-opacity="0.3" />
    <text x="30" y="96" fill="#a5b4fc" class="code-font" font-size="9">1-CLICK</text>
  </g>

  <!-- Dynamic Side Graphic 2: Smart Gateway Routing Node (Right Background) -->
  <g class="card-float-right" transform="translate(960, 110)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle class="radar-signal" cx="150" cy="30" r="8" fill="none" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="150" cy="30" r="4" fill="#8b5cf6" />
    <text x="24" y="34" fill="#cbd5e1" class="code-font" font-size="11" font-weight="600">ORCHESTRATOR</text>
    <line x1="24" y1="58" x2="156" y2="58" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <text x="24" y="76" fill="#94a3b8" class="sub-text" font-size="10">Latency: 12ms</text>
    <text x="24" y="94" fill="#10b981" class="code-font" font-size="10">Routing: 99.98%</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="url(#badgeGrad)" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="-116" cy="0" r="4" fill="#ec4899" />
    <text x="-104" y="5" fill="#e0e7ff" class="code-font" font-size="11" font-weight="600" letter-spacing="0.08em">CURATED COMMERCE &amp; PAYMENTS</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <text class="title-text" x="600" y="160" text-anchor="middle" font-size="52" fill="#ffffff" filter="url(#glowFilter)">
    Awesome Checkout Platform
  </text>
  <text class="title-text" x="600" y="160" text-anchor="middle" font-size="52" fill="url(#primaryGrad)">
    Awesome Checkout Platform
  </text>

  <!-- FOREGROUND CONTENT: Subtitle & Tagline -->
  <text class="sub-text" x="600" y="212" text-anchor="middle" font-size="20" fill="#f1f5f9">
    Hosted Checkout Pages, Payment Orchestration &amp; Composable Frameworks
  </text>
  <text class="sub-text" x="600" y="246" text-anchor="middle" font-size="14" fill="#94a3b8" letter-spacing="0.02em">
    Comparing top SaaS Checkout leaders alongside high-performance Open-Source payment stacks
  </text>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(230, 290)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <text x="82" y="23" text-anchor="middle" fill="#93c5fd" class="sub-text" font-size="12" font-weight="600">⚡ 1-Click Checkout</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(185, 0)">
      <rect width="190" height="36" rx="18" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="95" y="23" text-anchor="middle" fill="#c4b5fd" class="sub-text" font-size="12" font-weight="600">💳 Payment Orchestration</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(395, 0)">
      <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
      <text x="85" y="23" text-anchor="middle" fill="#f472b6" class="sub-text" font-size="12" font-weight="600">🛡️ PCI-DSS Compliant</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(585, 0)">
      <rect width="160" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="80" y="23" text-anchor="middle" fill="#6ee7b7" class="sub-text" font-size="12" font-weight="600">🚀 Open-Source Stacks</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
